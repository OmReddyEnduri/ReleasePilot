[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releasepilot"
version = "0.1.0"
description = "Developer workspace for semantic versioning, release hygiene validation, and artifact packaging."
readme = "README.md"
authors = [
    { name = "OmReddyEnduri", email = "omreddy@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving :: Packaging",
]
keywords = ["release", "semver", "changelog", "packaging", "checksums", "hygiene", "cli"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/OmReddyEnduri/ReleasePilot"
Repository = "https://github.com/OmReddyEnduri/ReleasePilot"
Issues = "https://github.com/OmReddyEnduri/ReleasePilot/issues"
Changelog = "https://github.com/OmReddyEnduri/ReleasePilot/blob/main/CHANGELOG.md"

[project.scripts]
releasepilot = "releasepilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["releasepilot*"]
